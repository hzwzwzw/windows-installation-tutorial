<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aptio Setup Utility</title><style>
:root{--blue:#0000aa;--gray:#c0c0c0;--white:#fff;--black:#000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{font-family:'Courier New',monospace;font-weight:700}button,input{font:inherit}#viewport{height:100%;display:flex;align-items:center;justify-content:center}#screen{width:1120px;height:760px;flex-shrink:0;position:relative;background:var(--gray);color:var(--blue);font-size:19px;line-height:25px;transform-origin:center;display:flex;flex-direction:column}header{height:28px;background:var(--blue);color:white;text-align:center;white-space:nowrap;font-size:18px}nav{display:flex;background:var(--blue);height:29px;padding-left:24px;gap:4px}button{cursor:pointer;border:0;border-radius:0;color:inherit;background:transparent;padding:0;text-align:left}nav button{padding:0 12px;color:var(--gray)}nav button.active{background:var(--gray);color:var(--blue)}.frame{margin:8px 3px 5px;border:2px solid var(--blue);flex:1;display:grid;grid-template-columns:68% 32%;min-height:0}.content{padding:9px 22px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--blue) var(--gray)}aside{border-left:2px solid var(--blue);display:flex;flex-direction:column;padding:8px 6px}.help{height:48%;white-space:pre-line}.legend{border-top:2px solid var(--blue);padding-top:8px;white-space:pre-line}.section{color:black;margin:0 0 10px}.row{min-height:25px;display:grid;grid-template-columns:53% 47%;width:100%;white-space:pre-wrap;position:relative}.row.selected{color:white}.row.readonly{color:#555}.row.heading{color:black;margin-top:20px}.row.disabled{color:#808080}.row .value{overflow-wrap:anywhere}.row.sub .label:before{content:'▸';position:absolute;left:-17px}.breadcrumb{color:black;margin-bottom:18px}.footer{background:var(--blue);color:var(--gray);text-align:center;height:27px;font-size:17px}.overlay{position:absolute;inset:57px 0 27px;display:flex;justify-content:center;align-items:center;background:#0001;z-index:4}.dialog{min-width:380px;max-width:800px;background:var(--blue);color:white;border:3px double white;padding:14px 22px;box-shadow:12px 12px #0008}.dialog h2{font-size:19px;text-align:center;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid var(--gray)}.dialog p{white-space:pre-wrap;margin:10px 0 18px}.choice{display:block;width:100%;padding:2px 8px;color:var(--gray)}.choice.selected{background:var(--gray);color:var(--blue)}.actions{display:flex;justify-content:center;gap:40px;margin-top:18px}.actions button{padding:0 8px}.actions .selected{background:var(--gray);color:var(--blue)}input{color:white;background:var(--blue);border:1px solid white;outline:none;padding:4px;width:100%;caret-color:white}.boot{position:absolute;inset:0;background:#000;color:#ccc;z-index:3;padding:45px;display:flex;flex-direction:column}.boot .brand{font-size:30px;color:white;margin-bottom:35px}.boot .bottom{margin-top:auto;color:#999;font-size:17px}.boot .choice{margin:3px 0}.boot.ventoy{background:#123c79;color:white;padding:48px 70px}.ventoy .brand{font-size:52px;font-style:italic}.ventoy .menu{border:2px solid white;padding:25px 18px;margin-top:35px}.ventoy .choice.selected{background:white;color:#123c79}.windows{align-items:center;justify-content:center;text-align:center}.winlogo{display:grid;grid-template-columns:50px 50px;gap:5px;margin-bottom:45px}.winlogo i{height:50px;background:#008bdf}.spinner{font-size:32px;margin:25px;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.2}}.small{font-size:16px;line-height:22px}#touchbar{position:fixed;bottom:0;display:none;background:#0000aa;color:white;gap:16px;padding:8px;z-index:10}@media(pointer:coarse){#touchbar{display:flex}}a{color:inherit}
</style></head><body><div id="viewport"><main id="screen" aria-label="UEFI BIOS simulator" tabindex="0"></main></div><div id="touchbar"></div><script src="app.js"></script><script src="training.js"></script><script src="windows-bridge.js"></script></body></html>
