<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 安装 Tutorial</title><link rel="stylesheet" href="windows.css"></head><body>
<header class="tutorial-header"><div><h1>Windows 安装 Tutorial</h1></div></header>
