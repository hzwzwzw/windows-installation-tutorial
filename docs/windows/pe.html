<main><aside class="guide"><h2 id="guide-title"></h2><p id="guide-text"></p><ol id="checks"></ol><details open><summary>操作提示</summary><p id="hint"></p></details><div id="consequences" role="status"></div><button id="reset">重置虚拟环境</button><details><summary>操作记录</summary><ul id="log"></ul></details></aside>

(function(root){
const clone=x=>JSON.parse(JSON.stringify(x));
const part=(id,label,letter,size,fs='NTFS',kind='Basic',files=[])=>({id,label,letter,size,fs,kind,files,used:files.length?Math.min(size/2,48000):0,formatted:false,os:files.includes('Windows')?'Windows 10 专业版':null,applied:false,aligned:true,locked:false});
function create(scenario='existing'){
 const target={id:'ssd',name:'WD Blue SN580 1TB',serial:'WD-WX11A0001',bus:'NVMe',size:953868,table:'GPT',parts:[part('esp','ESP','',300,'FAT32','ESP',['EFI','EFI/Microsoft/Boot/BCD']),part('msr','MSR','',16,'—','MSR'),part('os','Windows','D',204800,'NTFS','Basic',['Windows','Program Files','Users']),part('data','资料','E',748752,'NTFS','Basic',['毕业论文','照片','项目资料'])],boot:'os'};

 if(scenario==='blank'){target.parts=[];target.boot=null}

 if(scenario==='mbr'){target.table='MBR';target.parts=target.parts.filter(p=>p.kind==='Basic');target.boot=null}
 const usb={id:'usb',name:'SanDisk Ultra 64GB',serial:'USB-064',bus:'USB',size:61040,table:'MBR',parts:[part('u','Ventoy','U',61008,'exFAT','Basic',['ISO','Images','Tools']),part('uefi','VTOYEFI','',32,'FAT','ESP',['EFI'])],boot:null};

}
function disk(s,id,working=false){return (working&&s.pending?s.pending:s.disks).find(d=>d.id===id)}

function quick(s,id,o){if(s.pending)throw Error('请先保存或放弃分区表更改。');const d=disk(s,id),sizes=o.sizes.map(Number);if(!sizes.length||sizes.some(n=>!Number.isFinite(n)||n<1024))throw Error('每个普通分区至少为 1 GB。');const esp=o.table==='GPT'&&o.esp?Number(o.espSize):0,msr=o.table==='GPT'&&o.msr?16:0;if(esp&&(esp<100||esp>2048))throw Error('ESP 大小应在 100–2048 MB。');if(sizes.reduce((a,b)=>a+b,0)+esp+msr>d.size)throw Error('分区容量超过磁盘可用容量。');d.parts.forEach(p=>lose(s,p));d.table=o.table;d.boot=null;d.parts=[];if(esp)d.parts.push(part(id+'-esp','ESP','',esp,'FAT32','ESP'));if(msr)d.parts.push(part(id+'-msr','MSR','',msr,'—','MSR'));const occupied=s.disks.flatMap(x=>x.parts.map(p=>p.letter));sizes.forEach((n,i)=>{const letter='CDEFGHIJKLMNOPQRSTVWYZ'.split('').find(l=>!occupied.includes(l));occupied.push(letter);const p=part(id+'-q'+i,o.labels[i]||'',letter,n,o.fs[i]);p.formatted=true;p.aligned=o.align;d.parts.push(p)});let start=0;for(const p of d.parts){p.start=start;start+=p.size}if(id==='usb')s.media=false;log(s,'快速分区 '+d.name+' / '+d.table+' / '+sizes.length+' 个普通分区')}

function volumes(){return state.disks.flatMap(d=>d.parts.filter(p=>p.letter).map(p=>({d,p}))).concat([{d:{id:'ram',name:'RAMDisk',bus:'RAM'},p:{id:'ram',label:'Boot',letter:'X',size:4096,used:1700,fs:'NTFS',files:['Windows','Program Files','Users'],kind:'Basic'}}])}
function mark(id){if(!state.seen.includes(id))state.seen.push(id);guide()}
function peProgress(){const applied=!!M.find(state,state.applied).p?.applied;return {inspected:state.seen.includes('partition')||applied,edited:state.seen.includes('edited'),applied,restarted:state.booted}}
function inspectPartition(id){const {d,p}=M.find(state,id,true);if(d&&d.bus!=='USB'&&p.kind==='Basic')mark('partition')}
// Count committed DiskGenius operations, not opening dialogs or cancelled edits.
for(const name of ['quick','format','save']){const original=M[name];M[name]=function(s,...args){const before=JSON.stringify(s.disks.filter(d=>d.bus!=='USB'));const result=original(s,...args);if(s===state&&before!==JSON.stringify(s.disks.filter(d=>d.bus!=='USB')))mark('edited');return result}}
function guide(){
 $('#guide-title').textContent='自由安装 Windows';
 $('#guide-text').textContent='从 Ventoy U 盘进入 PE，自行选择硬盘、分区并安装 Windows。系统安装目标硬盘上的数据可以直接清除。';
 const progress=peProgress();
 $('#checks').innerHTML=[['inspected','使用资源管理器或 DiskGenius 确认安装分区'],['edited','使用 DiskGenius 进行分区编辑（可选）'],['applied','使用 Dism++ 释放镜像'],['restarted','重启电脑']].map(([key,text])=>'<li class="'+(progress[key]?'done':'')+'">'+text+'</li>').join('');
 if(window.PE_EMBEDDED)parent.postMessage({type:'pe-progress',token:window.PE_RUN_TOKEN,progress},'*');
 $('#hint').textContent='DiskGenius：F6 快速分区，可选择 GUID、ESP 和 MSR。Dism++：文件 → 释放映像，先浏览选择 ISO，再选择目标映像和安装分区。';

}

function openApp(id){if(busy&& !apps[id])return;if(!apps[id]){const el=document.createElement('section');el.id='app-'+id;el.className='app-window '+id;el.style.left=({explorer:90,dg:36,dism:85}[id])+'px';el.style.top=({explorer:65,dg:35,dism:68}[id])+'px';$('#windows').append(el);apps[id]=el}apps[id].hidden=false;apps[id].style.zIndex=++topZ;renderApp(id);renderTasks();if(id==='dg')mark('dg')}

function folderItems(path){if(path==='u/ISO')return state.media?[{id:images[0],name:images[0].split('\\').pop(),type:'光盘映像文件'}]:[];if(path==='u/Images')return state.media?images.slice(1).map(i=>({id:i,name:i.split('\\').pop(),type:'Windows 映像文件'})):[];if(path==='u/Tools')return [{id:'tool-dg',name:'DiskGenius.exe',type:'应用程序'},{id:'tool-dism',name:'Dism++x64.exe',type:'应用程序'}];const v=volumes().find(v=>v.p.id===path);if(v)return v.p.files.filter(x=>!x.includes('/')).map(name=>({id:path+'/'+name,name,folder:true}));if(path.endsWith('/Windows'))return [{id:'info-system',name:'System32',folder:true},{id:'info-system',name:'explorer.exe',type:'应用程序'}];if(/毕业论文|照片|项目资料|备份|课程资料/.test(path))return [{id:'info-data',name:'重要资料.docx',type:'Word 文档'},{id:'info-data',name:'照片备份.zip',type:'压缩文件'}];return []}

case'repair':if(dismSession==='pe'){message('引导修复','请先在顶部系统标签中选择已释放到内置硬盘的 Windows。');break}safe(()=>confirmDismBoot(dismSession));break;

$('#desktop').addEventListener('click',e=>{const el=e.target.closest('button,[data-part],[data-dgfolder],[data-dgfile]');if(!el)return;if(!['dg-file','dg-disk','dg-part','dism-file','dism-recovery','start'].includes(el.dataset.action))$('#menu-host').innerHTML='';if(busy&&!['cancel-work'].includes(el.dataset.action))return;if(el.dataset.open){if(!el.closest('.desktop-icons'))openApp(el.dataset.open);return}if(el.dataset.task){openApp(el.dataset.task);return}if(el.dataset.win){const id=el.dataset.id;if(el.dataset.win==='close'){if(id==='dg'&&state.pending){showModal('close-dg','DiskGenius','<p>分区表已更改。是否保存后退出？</p>',btn('close-save','保存')+btn('close-discard','不保存')+btn('modal-close','取消'));return}apps[id].remove();delete apps[id];renderTasks()}else if(el.dataset.win==='min')apps[id].hidden=true;else apps[id].classList.toggle('maximized');return}if(el.dataset.action){action(el.dataset.action,el);return}if(el.dataset.folder){folder(el.dataset.folder);return}if(el.dataset.file){inspectPartition(el.dataset.file.split('/')[0]);selectedFile=el.dataset.file;document.querySelectorAll('[data-file]').forEach(x=>x.classList.toggle('selected',x===el));return}if(el.dataset.dgcollapse){const id=el.dataset.dgcollapse;dgCollapsed.has(id)?dgCollapsed.delete(id):dgCollapsed.add(id);renderApp('dg');return}if(el.dataset.dgexpand){const id=el.dataset.dgexpand;dgExpanded.has(id)?dgExpanded.delete(id):dgExpanded.add(id);renderApp('dg');return}if(el.hasAttribute('data-dgfolder')){selectedPart=el.dataset.fpart;selectedDisk=M.find(state,selectedPart,true).d.id;inspectPartition(selectedPart);dgFolder=el.dataset.dgfolder;dgTab='files';renderApp('dg');return}if(el.dataset.dgfile){apps.dg.querySelectorAll('[data-dgfile]').forEach(x=>x.classList.toggle('selected',x===el));return}if(el.dataset.disk){selectedDisk=el.dataset.disk;selectedPart=disk(selectedDisk).parts[0]?.id||'';renderApp('dg');return}if(el.dataset.part){dgFolder='';selectedPart=el.dataset.part;selectedDisk=M.find(state,selectedPart,true).d.id;inspectPartition(selectedPart);renderApp('dg');return}if(el.dataset.free){selectedDisk=el.dataset.free;selectedPart='';renderApp('dg');return}if(el.dataset.dgtab){if(el.dataset.dgtab==='sector'){message('扇区编辑','前面的区域以后再来探索吧');return}dgTab=el.dataset.dgtab;renderApp('dg');return}if(el.dataset.inspect){message('文件检查',el.dataset.inspect==='Windows'?'检测到旧 Windows 目录。请结合硬盘型号和其他文件判断用途。':'已找到 '+el.dataset.inspect+'。资料文件在格式化后将消失。');return}if(el.dataset.session){dismSession=el.dataset.session;renderApp('dism');return}if(el.dataset.pickImage){applyForm.source=el.dataset.pickImage;mark('image');applyDialog();return}if(el.dataset.pickTarget){applyForm.target=el.dataset.pickTarget;applyForm.targetPath=M.find(state,applyForm.target).p.letter+':\\';applyDialog();return}});
$('#desktop').addEventListener('dblclick',e=>{if(busy)return;const a=e.target.closest('[data-open]'),f=e.target.closest('[data-file]');if(a)openApp(a.dataset.open);if(f)launchFile(f.dataset.file);const df=e.target.closest('[data-dgfile]');if(df){if(df.dataset.isfolder==='true'){dgFolder=(dgFolder?dgFolder+'/':'')+df.dataset.dgfile;renderApp('dg')}else message('文件信息',df.dataset.dgfile+'：虚拟磁盘中的文件。')}});
$('#desktop').addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy){closeModal();$('#menu-host').innerHTML='';return}if(e.key==='Tab'&&modal){const focusable=[...$('#modal-host').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex="0"]')];if(!focusable.length)return;const i=focusable.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&i===focusable.length-1){e.preventDefault();focusable[0].focus()}return}if(busy)return;if(modal?.kind==='quick-dialog'&&/^[3-6]$/.test(e.key)&&!['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();readQuick();quickDraft.custom=false;quickDraft.count=+e.key;distributeQuick();drawQuick()}if(e.key==='F6'&&apps.dg&&!apps.dg.hidden&&!modal){e.preventDefault();quickDialog()}if(e.ctrlKey&&e.key.toLowerCase()==='s'&&apps.dg&&!modal){e.preventDefault();action('save')}if(e.key==='Enter'){const f=e.target.closest('[data-file]'),a=e.target.closest('.desktop-icons [data-open]');if(f){e.preventDefault();launchFile(f.dataset.file)}if(a){e.preventDefault();openApp(a.dataset.open)}}});

$('#desktop').addEventListener('change',e=>{const el=e.target;if(modal?.kind==='quick-dialog'){readQuick();if(el.name==='q-table')quickDraft.table=el.value;if(el.name==='q-number'){quickDraft.custom=el.value==='custom';if(!quickDraft.custom)quickDraft.count=+el.value}if(el.id==='q-count'){quickDraft.custom=true;quickDraft.count=+el.value}if(el.id==='q-disk'){quickDraft.id=el.value;quickDraft.table=disk(el.value).table}if(['q-count','q-disk','q-esp','q-msr','q-esp-size'].includes(el.id)||el.name==='q-table'||el.name==='q-number'){distributeQuick();drawQuick()}}if(el.id==='new-unit'){const size=$('#new-size'),old=el.dataset.lastUnit||'MB';size.value=+size.value*(old==='GB'?1024:1)/(el.value==='GB'?1024:1);size.max=M.free(disk(selectedDisk))/(el.value==='GB'?1024:1);size.step='any';el.dataset.lastUnit=el.value}if(el.id==='new-fs'){$('#new-unit').value='MB';$('#new-unit').dataset.lastUnit='MB';$('#new-size').max=M.free(disk(selectedDisk));const k=['ESP','MSR'].includes(el.value)?el.value:'Basic';$('#new-kind').value=k;$('#new-size').value=k==='ESP'?Math.min(300,M.free(disk(selectedDisk))):k==='MSR'?16:M.free(disk(selectedDisk));$('#new-label').value=k==='Basic'?'新加卷':k;$('#new-type-name').value=k==='ESP'?'EFI system partition':k==='MSR'?'Microsoft reserved partition':'Basic data partition';$('#new-sectors').value=+$('#new-size').value*2048}if(['new-unit','new-fs'].includes(el.id))syncNewDetails();if(el.id==='apply-source'){readApply();applyDialog()}if(el.id==='apply-edition'){readApply();applyDialog()}});
$('#desktop').addEventListener('input',e=>{if(e.target.id==='new-size')syncNewDetails();if(e.target.id==='file-search'){const text=e.target.value.toLowerCase();apps.explorer.querySelectorAll('[data-file]').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(text))}});
let dragging=null;$('#desktop').addEventListener('pointerdown',e=>{const w=e.target.closest('.app-window');if(w&&!modal)w.style.zIndex=++topZ;const t=e.target.closest('[data-drag]');if(!t||e.target.closest('button')||w.classList.contains('maximized')||modal)return;const scale=$('#desktop').getBoundingClientRect().width/$('#desktop').offsetWidth;dragging={w,scale,x:e.clientX,y:e.clientY,left:parseFloat(w.style.left),top:parseFloat(w.style.top)};t.setPointerCapture(e.pointerId)});$('#desktop').addEventListener('pointermove',e=>{if(!dragging)return;const d=dragging;d.w.style.left=Math.max(0,Math.min(1120-d.w.offsetWidth,d.left+(e.clientX-d.x)/d.scale))+'px';d.w.style.top=Math.max(0,Math.min(700,d.top+(e.clientY-d.y)/d.scale))+'px'});$('#desktop').addEventListener('pointerup',()=>dragging=null);
